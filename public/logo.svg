<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="py-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="py-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Shield Container -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="6" y="6" width="88" height="88" rx="22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" filter="url(#glow)"/>

  <!-- Upper Python Snake in Electric Cyan / Blue -->
  <path d="M50 16 C34 16 23 27 23 41 L23 49 L50 49 L50 56 L15 56 C15 56 12 56 12 65 L12 76 C12 85 22 90 35 90 L43 90 L43 80 L35 80 C26 80 23 75 23 68 L23 65 L57 65 C68 65 77 56 77 45 L77 34 C77 23 66 16 50 16 Z"
        fill="url(#py-blue)" fill-opacity="0.95"/>
  <circle cx="34" cy="27" r="4" fill="#ffffff"/>

  <!-- Lower Python Snake in Amber / Yellow -->
  <path d="M50 84 C66 84 77 73 77 59 L77 51 L50 51 L50 44 L85 44 C85 44 88 44 88 35 L88 24 C88 15 78 10 65 10 L57 10 L57 20 L65 20 C74 20 77 25 77 32 L77 35 L43 35 C32 35 23 44 23 55 L23 66 C23 77 34 84 50 84 Z"
        fill="url(#py-yellow)" fill-opacity="0.95"/>
  <circle cx="66" cy="73" r="4" fill="#020617"/>

  <!-- Center Graduation Hat Accent -->
  <polygon points="50,38 68,47 50,56 32,47" fill="#ffffff" fill-opacity="0.95"/>
  <polygon points="41,52 41,60 50,65 59,60 59,52 50,57" fill="#38bdf8"/>
</svg>
